name: tests

on:
  push:
  pull_request:

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update
      - run: >-
          sudo apt-get install -y fonts-dejavu-core fonts-liberation libegl1 libgl1
          libgl1-mesa-dri libxkbcommon-x11-0 libxcb-cursor0 libva2 libva-x11-2
          xauth xvfb
      - run: pip install -r requirements-dev.txt
      - run: pip install --no-deps -e .
      - run: python scripts/generate_samples.py
      - run: pytest -q
      - run: QT_QPA_PLATFORM=xcb bash scripts/test_gui_ubuntu.sh
      - run: ruff check src tests scripts
